[project]
name = "financial-document-intelligence"
version = "1.0.0"
description = "Grounded extraction and validation for financial documents"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "Jinja2>=3.1,<4.0",
  "pypdf>=5.0,<7.0",
  "Pillow>=10.0,<13.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using .httpx. with .starlette.testclient. is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "backend.app.main:app"
