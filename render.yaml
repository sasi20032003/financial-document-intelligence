databases:
  - name: document-intelligence-db
    plan: free
    databaseName: document_intelligence
    user: document_intelligence

services:
  - type: web
    name: financial-document-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: document-intelligence-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
